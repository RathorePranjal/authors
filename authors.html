<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Quotes Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 1s ease;
            text-align: center;
        }
        
        .quote-container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 2rem;
            border-radius: 10px;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 2rem;
        }
        
        .quote {
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 1rem;
        }
        
        .author {
            font-weight: bold;
            color: #555;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 1rem 0;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .emoji {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="quote-container">
        <h1>Colorful Quotes Generator</h1>
        <div class="emoji" id="emoji">✨</div>
        <div class="quote" id="quote">Click the button to generate a random quote!</div>
        <div class="author" id="author"></div>
        <button id="generate-btn">Generate Quote</button>
    </div>

    <script>
        const quotes = [
            {
                quote: "The only way to do great work is to love what you do.",
                author: "Steve Jobs",
                emoji: "❤️",
                color: "#FF6B6B"
            },
            {
                quote: "Life is what happens when you're busy making other plans.",
                author: "John Lennon",
                emoji: "🎵",
                color: "#4ECDC4"
            },
            {
                quote: "The future belongs to those who believe in the beauty of their dreams.",
                author: "Eleanor Roosevelt",
                emoji: "🌠",
                color: "#FFBE0B"
            },
            {
                quote: "It is never too late to be what you might have been.",
                author: "George Eliot",
                emoji: "⏳",
                color: "#8338EC"
            },
            {
                quote: "Success is not final, failure is not fatal: It is the courage to continue that counts.",
                author: "Winston Churchill",
                emoji: "🦁",
                color: "#3A86FF"
            },
            {
                quote: "Happiness is not something ready made. It comes from your own actions.",
                author: "Dalai Lama",
                emoji: "☸️",
                color: "#06D6A0"
            },
            {
                quote: "The only limit to our realization of tomorrow is our doubts of today.",
                author: "Franklin D. Roosevelt",
                emoji: "🚀",
                color: "#FF006E"
            }
        ];

        const quoteElement = document.getElementById('quote');
        const authorElement = document.getElementById('author');
        const emojiElement = document.getElementById('emoji');
        const generateBtn = document.getElementById('generate-btn');
        const body = document.body;

        function getRandomQuote() {
            return quotes[Math.floor(Math.random() * quotes.length)];
        }

        function displayQuote() {
            const randomQuote = getRandomQuote();
            quoteElement.textContent = randomQuote.quote;
            authorElement.textContent = `— ${randomQuote.author}`;
            emojiElement.textContent = randomQuote.emoji;
            body.style.backgroundColor = randomQuote.color;
        }

        generateBtn.addEventListener('click', displayQuote);

        // Display a random quote when the page loads
        displayQuote();
    </script>
</body>
</html>
